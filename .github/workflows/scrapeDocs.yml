name: Fetch board minutes

on: workflow_dispatch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
    - name: Install scraper dependencies
      run: pip install requests beautifulsoup4
    - name: Fetch published minutes
      run: python scrape_docs.py

    - name: Configure git and Push changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add minutes
        if [ -f json_files/fetched_ids.json ]; then
          git add json_files/fetched_ids.json
        fi
        if git diff --cached --quiet; then
          echo "No new minutes to commit."
          exit 0
        fi
        git commit -m "Fetch latest board minutes"
        git push
